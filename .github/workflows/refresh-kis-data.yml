name: Refresh KIS data

on:
  schedule:
    - cron: "17 21 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - refresh_media.py
      - .github/workflows/refresh-kis-data.yml

permissions:
  contents: write

concurrency:
  group: refresh-kis-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the default branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install feed dependencies
        run: python -m pip install --upgrade pip pdfplumber

      - name: Refresh KIS and social feeds
        id: refresh
        continue-on-error: true
        run: python refresh_media.py

      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/media.js assets/insta
          if git diff --cached --quiet; then
            echo "No generated data changes to commit."
            exit 0
          fi
          git commit -m "chore: refresh KIS data feeds"
          git push

      - name: Report source refresh failures
        if: steps.refresh.outcome == 'failure'
        run: |
          echo "One or more KIS sources failed. Successful feeds were committed; failed feeds retain their last successful data."
          exit 1
